name: Release

# Publishes a tagged version (ADR-013): every check, the agent signed with the release key,
# the agent bundled into the CLI with its SHA-256, npm packages published with trusted
# publishing (OIDC, provenance), and a GitHub Release with the APK, checksums and an SBOM.
#
# Before the first run, Florent sets up (docs/decisions.md, F-1 and F-5):
#   - secrets PRAGU_KEYSTORE_BASE64, PRAGU_KEYSTORE_PASSWORD, PRAGU_KEY_ALIAS, PRAGU_KEY_PASSWORD;
#   - the @pragu organisation on npm, and this workflow as the trusted publisher of each package.
# Then: pnpm changeset version, commit, tag vX.Y.Z, push the tag.
#
# A manual run (Actions → Release → Run workflow, on main) is a dry run: every check, the agent
# built with the debug key, the packages packed and installed as a user would, the release notes
# extracted; nothing is signed with the release key, published to npm or released on GitHub.

on:
  push:
    # Version tags only: moving the action's major tag (v0) must not start a release.
    tags: ['v[0-9]+.[0-9]+.[0-9]+', 'v[0-9]+.[0-9]+.[0-9]+-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: ${{ github.event_name == 'push' && format('Release {0}', github.ref_name) || 'Release dry run' }}
    if: github.repository == 'FlorentLatifi/Pragu'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: write # the GitHub Release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: The tag matches the package versions
        run: |
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version=$(node -p "require('./packages/cli/package.json').version")
          fi
          for pkg in cli core report; do
            actual=$(node -p "require('./packages/$pkg/package.json').version")
            if [ "$actual" != "$version" ]; then
              echo "packages/$pkg is $actual, the tag says $version. Run pnpm changeset version first."; exit 1
            fi
          done
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bench
      - run: pnpm report:a11y

      # A dry run gets no secrets at all, so its agent is signed with the debug key.
      - name: Build and sign the agent
        working-directory: agents/android
        env:
          KEYSTORE_BASE64: ${{ github.event_name == 'push' && secrets.PRAGU_KEYSTORE_BASE64 || '' }}
          PRAGU_KEYSTORE_PASSWORD: ${{ github.event_name == 'push' && secrets.PRAGU_KEYSTORE_PASSWORD || '' }}
          PRAGU_KEY_ALIAS: ${{ github.event_name == 'push' && secrets.PRAGU_KEY_ALIAS || '' }}
          PRAGU_KEY_PASSWORD: ${{ github.event_name == 'push' && secrets.PRAGU_KEY_PASSWORD || '' }}
          PRAGU_VERSION_CODE: ${{ github.run_number }}
        run: |
          export PRAGU_VERSION="$VERSION"
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            export PRAGU_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
            trap 'rm -f "$PRAGU_KEYSTORE_FILE"' EXIT
            echo "$KEYSTORE_BASE64" | base64 --decode > "$PRAGU_KEYSTORE_FILE"
          fi
          ./gradlew --no-daemon :agent:assembleRelease :agent:testDebugUnitTest :agent:lintRelease :agent:verifyReleaseNoInternetPermission

      - name: Bundle the agent into the CLI
        run: node scripts/bundle-agent.mjs

      - name: Pack
        run: |
          mkdir -p "$RUNNER_TEMP/packages"
          for pkg in core report cli; do (cd "packages/$pkg" && pnpm pack --pack-destination "$RUNNER_TEMP/packages"); done
          cp packages/cli/agent/pragu-agent.apk "$RUNNER_TEMP/packages/pragu-agent-$VERSION.apk"
          pnpm sbom --sbom-format cyclonedx --prod > "$RUNNER_TEMP/packages/pragu-$VERSION.cdx.json"
          (cd "$RUNNER_TEMP/packages" && sha256sum * > SHA256SUMS)

      # The bytes about to be published, installed into an empty folder as a user would get them.
      - name: Install the packed tarballs before publishing them
        run: node scripts/check-package-install.mjs --tarballs "$RUNNER_TEMP/packages" --require-agent

      - name: Release notes for this version
        run: |
          awk -v heading="## $VERSION" '$0 == heading { found = 1; next } found && /^## / { exit } found { print }' \
            packages/cli/CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "packages/cli/CHANGELOG.md has no section for $VERSION. Run pnpm changeset version first."; exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      # Dependencies first: if a later publish failed, an earlier pragu would point at versions npm does not have.
      - name: Publish to npm (trusted publishing, provenance)
        if: github.event_name == 'push'
        run: |
          npm install --global npm@11.21.1
          for name in pragu-core pragu-report pragu; do
            npm publish "$RUNNER_TEMP/packages/$name-$VERSION.tgz" --access public --provenance
          done

      - name: GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --title "Pragu $VERSION" --notes-file "$RUNNER_TEMP/notes.md" --verify-tag \
            "$RUNNER_TEMP"/packages/*.apk "$RUNNER_TEMP"/packages/*.cdx.json "$RUNNER_TEMP"/packages/SHA256SUMS
