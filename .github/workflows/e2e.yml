name: Device end-to-end

# Records every Pragu Bench screen live on a fresh emulator and checks that the bench
# reproduces the published results exactly: the real test of the agent and capturer.
# Also enforces the per-scan time budget (docs/testing/strategy.md).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

env:
  API_LEVEL: 36
  # Seconds one scan may take on a CI emulator: the slowest measured scan was 7.6 s, so 20 s
  # absorbs runner noise and still catches a real slowdown (docs/testing/strategy.md).
  SCAN_BUDGET_SECONDS: 20

jobs:
  bench-on-emulator:
    name: Bench on an emulator
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0

      - name: Install and build Pragu
        run: |
          pnpm install --frozen-lockfile
          pnpm build
      - name: Build the agent
        run: pnpm agent:build
      - name: Build both fixture apps
        run: pnpm fixture:build

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Restore and save explicitly: a cache saved at the end of the job would also hold the
      # apps installed during it, signed with that runner's own debug key.
      - name: Restore the emulator image and snapshot
        id: avd-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-medium_phone-v2
      - name: Create the emulator snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: medium_phone
          force-avd-creation: false
          # Software rendering: the host-GPU driver crashes app render threads on some machines.
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Snapshot created for the cache."
      - name: Save the fresh emulator image and snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}-google_apis-x86_64-medium_phone-v2

      - name: Record every bench screen live, within the time budget
        uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          profile: medium_phone
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: node bench/dist/cli.js record --install --budget-seconds ${{ env.SCAN_BUDGET_SECONDS }}
      - name: The live recordings reproduce the published bench results
        run: pnpm bench

      - name: Keep the recordings for review
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-recordings
          path: bench/recordings
          retention-days: 7
