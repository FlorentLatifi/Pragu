name: DCO

# Every commit in an outside pull request carries a Developer Certificate of Origin sign-off
# (ADR-005, D-41). The maintainer's own commits and Dependabot's are exempt.

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    name: Signed-off-by on every commit
    if: github.event.pull_request.user.login != 'FlorentLatifi' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check sign-offs
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            if ! git log -1 --format=%B "$sha" | grep -qE '^Signed-off-by: .+ <.+>$'; then
              echo "::error::Commit $sha has no Signed-off-by line. Sign it with: git commit --amend -s (or git rebase --signoff $BASE)"
              missing=1
            fi
          done
          exit $missing
