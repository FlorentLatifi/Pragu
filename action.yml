name: Pragu accessibility checks
description: Comment the accessibility barriers a pull request adds, and keep the Pragu report as an artifact.
author: Florent Latifi
branding:
  icon: check-square
  color: yellow

# Runs after "pragu scan" in the same job (ADR-014). The scan itself stays in your workflow,
# because emulators, app builds and logins differ per team. No bundled JavaScript: the
# Markdown comes from "pragu comment", and GitHub is reached with the preinstalled gh CLI.
inputs:
  report-dir:
    description: Folder "pragu scan --out" wrote; uploaded as the artifact.
    default: pragu-report
  pragu:
    description: How to run Pragu, e.g. "npx --yes pragu@0.1.0".
    default: npx --yes pragu
  comment:
    description: Comment on the pull request ("false" writes only the job summary).
    default: 'true'
  artifact-name:
    description: Name of the uploaded report artifact; also how the main branch's scan is found.
    default: pragu-report
  retention-days:
    description: Days to keep the report artifact.
    default: '7'
  github-token:
    description: Token for comments and for reading the main branch's artifact.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Find the latest scan of the main branch
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        WORKFLOW: ${{ github.workflow }}
        MAIN: ${{ github.event.repository.default_branch }}
        ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --branch "$MAIN" --event push \
          --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
        if [ -n "$run_id" ]; then
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name "$ARTIFACT" --dir "$RUNNER_TEMP/pragu-main" \
            || echo "No $ARTIFACT artifact on the main branch's latest run; comparing with the baseline."
        fi

    - name: Write the comment
      shell: bash
      env:
        PRAGU: ${{ inputs.pragu }}
        REPORT_DIR: ${{ inputs.report-dir }}
      run: |
        $PRAGU comment "$REPORT_DIR/pragu-result.json" --base "$RUNNER_TEMP/pragu-main/pragu-result.json" \
          --report-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" --out "$RUNNER_TEMP/pragu-comment.md"
        cat "$RUNNER_TEMP/pragu-comment.md" >> "$GITHUB_STEP_SUMMARY"

    # Pull requests from forks get a read-only token, so they keep the job summary only;
    # pull_request_target, which would run their code with secrets, is never used.
    - name: Comment on the pull request
      if: >-
        inputs.comment == 'true' && github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        PR: ${{ github.event.pull_request.number }}
      run: |
        existing=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate \
          --jq '.[] | select(.body | startswith("<!-- pragu-comment -->")) | .id' | head -n 1)
        if [ -n "$existing" ]; then
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F "body=@$RUNNER_TEMP/pragu-comment.md" > /dev/null
        else
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$RUNNER_TEMP/pragu-comment.md" > /dev/null
        fi

    - name: Keep the report
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.report-dir }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: error

    - name: Upload SARIF for code scanning
      if: hashFiles(format('{0}/pragu-results.sarif', inputs.report-dir)) != ''
      uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        sarif_file: ${{ inputs.report-dir }}/pragu-results.sarif
        category: pragu
